<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restaurant Menu</title>
    <style>
      #menu {
        background-color: pink;
        border-radius: 10px;
        padding: 14px;
      }
      #menu li {
        display: inline;
      }
      #menu li a {
        background-color: azure;
        color: green;
        padding: 3px;
        border-radius: 5px;
        text-decoration: aqua;
      }
      #menu li a:hover {
        text-decoration: underline;
        border-radius: 5px;
        background-color: burlywood;
      }
      div {
        border: 5px;
        padding: 5px;
        margin: 5px;
      }
      #main {
        background-color: beige;
        overflow: hidden;
      }
      #appetizers {
        background-color: blanchedalmond;
        color: green;
        padding: 10px;
        border-radius: 15px;
        text-decoration: aqua;
      }
      #appetizers li a:hover {
        text-decoration: underline;
        border-radius: 5px;
        background-color: burlywood;
      }

      #course {
        background-color: blanchedalmond;
        color: green;
        padding: 10px;
        border-radius: 15px;
        text-decoration: aqua;
      }
      #course li a:hover {
        text-decoration: underline;
        border-radius: 5px;
        background-color: burlywood;
      }
      #desserts {
        background-color: blanchedalmond;
        color: green;
        padding: 10px;
        border-radius: 15px;
        text-decoration: aqua;
      }
      #footer {
        clear: both;
      }
    </style>
  </head>
  <body>
    <h1>Hello! My first HTML Page</h1>
    <ul id="menu">
      <li><a href="#">Home</a></li>
      <li><a href="#">Articles</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Contact</a></li>
    </ul>

    <ul id="appetizers">
      <li><a href="#">Appetizers</a></li>
    </ul>

    <ul id="course">
      <li><a href="#">Main Course</a></li>
    </ul>

    <ul id="desserts">
      <li><a href="#">Desserts</a></li>
    </ul>
  </body>
</html>
